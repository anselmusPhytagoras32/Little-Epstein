services:
  - type: web
    name: escape-the-epstein
    runtime: node
    plan: free
    rootDir: web
    buildCommand: corepack pnpm@10.30.3 install --frozen-lockfile --prod=false && corepack pnpm@10.30.3 build
    startCommand: corepack pnpm@10.30.3 db:migrate && corepack pnpm@10.30.3 start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
