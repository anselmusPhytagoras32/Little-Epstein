name: Cloud confidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: escape_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d escape_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/escape_test
      BOSS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/escape_test
      APP_URL: http://127.0.0.1:3000
      CHROME_DEBUG_URL: http://127.0.0.1:9223
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Check package manager setup order
        run: node scripts/workflow-order-check.mjs

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Production build
        run: pnpm build

      - name: Apply migrations twice
        run: |
          pnpm db:migrate
          pnpm db:migrate

      - name: Check scheduled game sweep
        run: pnpm sweep

      - name: Check missed days and winners
        run: node scripts/reconcile-check.mjs

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true

      - name: Start production app
        run: |
          pnpm start > /tmp/escape-app.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/escape-app.log
          exit 1

      - name: Start isolated headless Chrome
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --no-first-run --no-default-browser-check --remote-debugging-port=9223 \
            --user-data-dir=/tmp/escape-chrome about:blank > /tmp/escape-chrome.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9223/json/version > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/escape-chrome.log
          exit 1

      - name: Check registration origin handling
        run: node scripts/auth-origin-check.mjs

      - name: Check registration behind HTTPS proxy
        run: |
          TEST_CLOCK=2026-10-30T12:00:00Z NODE_OPTIONS=--require=./scripts/test-clock.cjs pnpm exec next start -H 127.0.0.1 -p 3104 > /tmp/escape-register.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3104/ > /dev/null; then break; fi
            sleep 1
          done
          APP_URL=http://127.0.0.1:3104 node scripts/register-check.mjs

      - name: Check daily rules with a fixed date
        run: |
          NODE_OPTIONS=--require=./scripts/test-clock.cjs pnpm exec next start -H 127.0.0.1 -p 3102 > /tmp/escape-clock.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3102/ > /dev/null; then break; fi
            sleep 1
          done
          APP_URL=http://127.0.0.1:3102 node scripts/check-in-check.mjs

      - name: Check session behavior during database outage
        run: |
          DATABASE_URL=postgresql://unused@127.0.0.1:55441/unused pnpm exec next start -H 127.0.0.1 -p 3103 > /tmp/escape-outage.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3103/ > /dev/null; then break; fi
            sleep 1
          done
          APP_URL=http://127.0.0.1:3103 node scripts/session-outage-check.mjs

      - name: Check onboarding and solo crew
        run: node scripts/onboarding-check.mjs

      - name: Check phone layouts and practice flows
        run: |
          UI_CHECK_PWA=1 node scripts/ui-check.mjs
          node scripts/swim-check.mjs

      - name: Check boss fight
        run: |
          node scripts/boss-check.mjs
          node scripts/boss-crew-check.mjs

      - name: Check authenticated multiplayer lobby against PostgreSQL
        run: node scripts/boss-lobby-check.mjs
