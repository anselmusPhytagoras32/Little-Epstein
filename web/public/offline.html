<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fcfaf4">
    <title>Offline · Escape the Epstein</title>
    <style>
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100svh; place-items: center; margin: 0; padding: 24px; background: #fcfaf4; color: #183c35; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
      main { width: min(100%, 360px); padding: 30px 24px; border: 1px solid #eae8df; border-radius: 20px; background: #fffdf8; }
      img { width: 64px; height: 64px; }
      h1 { margin: 15px 0 7px; font-size: 22px; }
      p { margin: 0; color: #62766d; }
      button { min-height: 48px; margin-top: 22px; padding: 0 20px; border: 0; border-radius: 12px; background: #235546; color: #fff; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/escape-app.svg" alt="">
      <h1>You’re offline for a moment.</h1>
      <p>Reconnect to check in and sync your crew’s status.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
